<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4f46e5;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="url(#grad)"/>

  <!-- Rocket icon -->
  <g transform="translate(28, 24) scale(0.55)" fill="white">
    <!-- Rocket body -->
    <path d="M64 8c-4.4 0-8 3.6-8 8v72c0 4.4 3.6 8 8 8s8-3.6 8-8V16c0-4.4-3.6-8-8-8z"/>

    <!-- Rocket nose cone -->
    <path d="M64 0L48 24h32L64 0z"/>

    <!-- Left fin -->
    <path d="M40 72l-16 24h16V72z"/>

    <!-- Right fin -->
    <path d="M88 72l16 24H88V72z"/>

    <!-- Rocket window -->
    <circle cx="64" cy="48" r="12" fill="#4f46e5"/>
    <circle cx="64" cy="48" r="8" fill="#818cf8"/>

    <!-- Flame -->
    <ellipse cx="64" cy="104" rx="12" ry="20" fill="#fbbf24"/>
    <ellipse cx="64" cy="108" rx="8" ry="14" fill="#f97316"/>
    <ellipse cx="64" cy="112" rx="4" ry="8" fill="#ef4444"/>
  </g>

  <!-- Sparkle effects -->
  <circle cx="100" cy="28" r="4" fill="white" opacity="0.8"/>
  <circle cx="28" cy="100" r="3" fill="white" opacity="0.6"/>
  <circle cx="108" cy="80" r="2" fill="white" opacity="0.7"/>
</svg>
