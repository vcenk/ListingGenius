<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ListingGenius - Keywords</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --primary: #6366f1;
      --primary-dark: #4f46e5;
      --primary-light: #818cf8;
      --success: #22c55e;
      --warning: #f59e0b;
      --danger: #ef4444;
      --gray-50: #f9fafb;
      --gray-100: #f3f4f6;
      --gray-200: #e5e7eb;
      --gray-300: #d1d5db;
      --gray-400: #9ca3af;
      --gray-500: #6b7280;
      --gray-600: #4b5563;
      --gray-700: #374151;
      --gray-800: #1f2937;
      --white: #ffffff;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      color: var(--gray-800);
      background: var(--white);
      min-height: 100vh;
    }

    .container {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Header */
    .header {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      padding: 16px;
      color: var(--white);
    }

    .header-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .header-title span {
      font-size: 20px;
    }

    .search-input {
      width: 100%;
      padding: 10px 14px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      background: rgba(255, 255, 255, 0.95);
      color: var(--gray-800);
    }

    .search-input::placeholder {
      color: var(--gray-400);
    }

    .search-input:focus {
      outline: none;
      box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.5);
    }

    /* Tabs */
    .tabs {
      display: flex;
      background: var(--gray-50);
      border-bottom: 1px solid var(--gray-200);
    }

    .tab {
      flex: 1;
      padding: 12px 16px;
      background: none;
      border: none;
      font-size: 13px;
      font-weight: 500;
      color: var(--gray-500);
      cursor: pointer;
      transition: all 0.2s;
      border-bottom: 2px solid transparent;
    }

    .tab:hover {
      color: var(--gray-700);
      background: var(--gray-100);
    }

    .tab.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
      background: var(--white);
    }

    /* Controls */
    .controls {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--gray-200);
    }

    .control-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 12px;
      background: var(--white);
      border: 1px solid var(--gray-200);
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      color: var(--gray-600);
      cursor: pointer;
      transition: all 0.2s;
    }

    .control-btn:hover {
      background: var(--gray-50);
      border-color: var(--gray-300);
    }

    .control-btn.active {
      background: var(--primary);
      border-color: var(--primary);
      color: var(--white);
    }

    select.control-select {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid var(--gray-200);
      border-radius: 6px;
      font-size: 12px;
      color: var(--gray-600);
      background: var(--white);
      cursor: pointer;
    }

    /* Main Content */
    .main-content {
      flex: 1;
      overflow-y: auto;
    }

    /* Keyword List */
    .keyword-list {
      list-style: none;
    }

    .keyword-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--gray-100);
      cursor: pointer;
      transition: background 0.15s;
    }

    .keyword-item:hover {
      background: var(--gray-50);
    }

    .keyword-item.selected {
      background: rgba(99, 102, 241, 0.05);
    }

    .keyword-checkbox {
      width: 18px;
      height: 18px;
      accent-color: var(--primary);
      cursor: pointer;
    }

    .keyword-info {
      flex: 1;
      min-width: 0;
    }

    .keyword-text {
      font-size: 14px;
      font-weight: 500;
      color: var(--gray-800);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .keyword-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 4px;
      font-size: 12px;
      color: var(--gray-500);
    }

    .volume-badge {
      padding: 2px 8px;
      background: var(--gray-100);
      border-radius: 12px;
      font-size: 11px;
      font-weight: 600;
      color: var(--gray-600);
    }

    .volume-badge.high {
      background: #dcfce7;
      color: #166534;
    }

    .volume-badge.medium {
      background: #fef3c7;
      color: #92400e;
    }

    .trend-indicator {
      display: flex;
      align-items: center;
      gap: 2px;
    }

    .trend-indicator.rising {
      color: var(--success);
    }

    .trend-indicator.declining {
      color: var(--danger);
    }

    .keyword-actions {
      display: flex;
      gap: 4px;
    }

    .action-btn-small {
      padding: 6px 8px;
      background: var(--white);
      border: 1px solid var(--gray-200);
      border-radius: 4px;
      font-size: 12px;
      color: var(--gray-500);
      cursor: pointer;
      transition: all 0.15s;
    }

    .action-btn-small:hover {
      background: var(--gray-50);
      border-color: var(--primary);
      color: var(--primary);
    }

    /* Empty State */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
      text-align: center;
    }

    .empty-icon {
      font-size: 48px;
      margin-bottom: 16px;
      opacity: 0.5;
    }

    .empty-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--gray-700);
      margin-bottom: 8px;
    }

    .empty-text {
      font-size: 14px;
      color: var(--gray-500);
      max-width: 280px;
    }

    /* Loading */
    .loading-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid var(--gray-200);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      margin-top: 12px;
      font-size: 14px;
      color: var(--gray-500);
    }

    /* Footer Actions */
    .footer-actions {
      display: flex;
      gap: 8px;
      padding: 16px;
      background: var(--gray-50);
      border-top: 1px solid var(--gray-200);
    }

    .footer-btn {
      flex: 1;
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .footer-btn.primary {
      background: var(--primary);
      color: var(--white);
    }

    .footer-btn.primary:hover {
      background: var(--primary-dark);
    }

    .footer-btn.secondary {
      background: var(--white);
      color: var(--gray-600);
      border: 1px solid var(--gray-200);
    }

    .footer-btn.secondary:hover {
      background: var(--gray-50);
      border-color: var(--gray-300);
    }

    .footer-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .selected-count {
      font-size: 12px;
      color: var(--gray-500);
      padding: 0 8px;
      display: flex;
      align-items: center;
    }

    /* Hidden utility */
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="header-title">
        <span>&#128273;</span>
        Keyword Intelligence
      </div>
      <input
        type="text"
        class="search-input"
        id="searchInput"
        placeholder="Search keywords..."
      >
    </header>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab active" data-tab="trending">Trending</button>
      <button class="tab" data-tab="competitor">Competitor</button>
      <button class="tab" data-tab="saved">Saved</button>
    </div>

    <!-- Controls -->
    <div class="controls">
      <select class="control-select" id="sortSelect">
        <option value="volume">Volume</option>
        <option value="trend">Trend</option>
        <option value="alpha">A-Z</option>
      </select>
      <button class="control-btn" id="selectAllBtn">Select All</button>
    </div>

    <!-- Main Content -->
    <main class="main-content" id="mainContent">
      <!-- Loading State -->
      <div class="loading-state" id="loadingState">
        <div class="spinner"></div>
        <p class="loading-text">Loading keywords...</p>
      </div>

      <!-- Empty State -->
      <div class="empty-state hidden" id="emptyState">
        <div class="empty-icon">&#128269;</div>
        <h3 class="empty-title">No keywords found</h3>
        <p class="empty-text">Enter a product idea in the search box above or validate a product in the popup.</p>
      </div>

      <!-- Keyword List -->
      <ul class="keyword-list hidden" id="keywordList"></ul>
    </main>

    <!-- Footer Actions -->
    <footer class="footer-actions">
      <span class="selected-count" id="selectedCount">0 selected</span>
      <button class="footer-btn secondary" id="copyBtn" disabled>Copy</button>
      <button class="footer-btn secondary" id="exportBtn" disabled>Export CSV</button>
      <button class="footer-btn primary" id="applyBtn" disabled>Apply to Listing</button>
    </footer>
  </div>

  <script src="sidepanel.js" type="module"></script>
</body>
</html>
